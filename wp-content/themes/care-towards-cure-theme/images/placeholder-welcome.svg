<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="welcomeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0f2fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:0.15" />
    </linearGradient>
    <style>
      .welcome-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; fill: #0066cc; text-anchor: middle; font-weight: 600; }
      .welcome-subtext { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; fill: #64748b; text-anchor: middle; }
    </style>
  </defs>
  <rect width="500" height="600" fill="url(#welcomeGrad)"/>

  <!-- Medical/Healthcare imagery -->
  <circle cx="250" cy="150" r="70" fill="#0284c7" opacity="0.1"/>
  <circle cx="250" cy="150" r="50" fill="#0284c7" opacity="0.2"/>
  <circle cx="250" cy="150" r="30" fill="#0284c7" opacity="0.3"/>

  <!-- Heart symbol inside -->
  <path d="M 250 130 C 250 125, 255 120, 260 120 C 265 120, 270 125, 270 130 C 270 140, 250 160, 250 160 C 250 160, 230 140, 230 130 C 230 125, 235 120, 240 120 C 245 120, 250 125, 250 130 Z" fill="#0284c7" opacity="0.6"/>

  <!-- Decorative elements -->
  <g opacity="0.15" stroke="#0066cc" stroke-width="2" fill="none">
    <path d="M 150 250 Q 250 200 350 250"/>
    <path d="M 150 300 Q 250 350 350 300"/>
    <path d="M 150 350 Q 250 300 350 350"/>
  </g>

  <!-- Bottom text -->
  <text class="welcome-text" x="250" y="500">Patient-Centered Care</text>
  <text class="welcome-subtext" x="250" y="525">Professional healthcare consultation</text>
  <text class="welcome-subtext" x="250" y="545">designed around your individual needs</text>
</svg>