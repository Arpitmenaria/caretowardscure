<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="doctorGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fce7f3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:0.15" />
    </linearGradient>
    <style>
      .doctor-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; fill: #ec4899; text-anchor: middle; font-weight: 600; }
      .doctor-subtext { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; fill: #64748b; text-anchor: middle; }
    </style>
  </defs>
  <rect width="400" height="500" fill="url(#doctorGrad2)"/>

  <!-- Head -->
  <circle cx="200" cy="120" r="60" fill="#ec4899" opacity="0.3"/>
  <circle cx="200" cy="120" r="50" fill="#ec4899" opacity="0.4"/>

  <!-- Face circle -->
  <circle cx="200" cy="115" r="45" fill="#fce7f3"/>

  <!-- Eyes -->
  <circle cx="185" cy="105" r="4" fill="#ec4899"/>
  <circle cx="215" cy="105" r="4" fill="#ec4899"/>

  <!-- Smile -->
  <path d="M 185 125 Q 200 135 215 125" stroke="#ec4899" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Medical cross symbol -->
  <g opacity="0.5" stroke="#ec4899" stroke-width="3" stroke-linecap="round">
    <line x1="200" y1="150" x2="200" y2="210"/>
    <line x1="170" y1="180" x2="230" y2="180"/>
  </g>

  <!-- Body/Coat -->
  <rect x="150" y="170" width="100" height="120" fill="#ec4899" opacity="0.1" rx="10"/>

  <!-- Bottom text -->
  <text class="doctor-text" x="200" y="420">Dr. Upload Image</text>
  <text class="doctor-subtext" x="200" y="445">Click to add doctor profile image</text>
  <text class="doctor-subtext" x="200" y="465">via WordPress Customizer</text>
</svg>