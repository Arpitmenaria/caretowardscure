<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="doctorGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0f2fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:0.15" />
    </linearGradient>
    <style>
      .doctor-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; fill: #0066cc; text-anchor: middle; font-weight: 600; }
      .doctor-subtext { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; fill: #64748b; text-anchor: middle; }
    </style>
  </defs>
  <rect width="400" height="500" fill="url(#doctorGrad1)"/>

  <!-- Head -->
  <circle cx="200" cy="120" r="60" fill="#0284c7" opacity="0.3"/>
  <circle cx="200" cy="120" r="50" fill="#0284c7" opacity="0.4"/>

  <!-- Face circle -->
  <circle cx="200" cy="115" r="45" fill="#e8f4f8"/>

  <!-- Eyes -->
  <circle cx="185" cy="105" r="4" fill="#0066cc"/>
  <circle cx="215" cy="105" r="4" fill="#0066cc"/>

  <!-- Smile -->
  <path d="M 185 125 Q 200 135 215 125" stroke="#0066cc" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Stethoscope symbol -->
  <path d="M 200 160 Q 185 180 180 200 Q 180 220 195 225 Q 210 225 210 220 Q 215 180 200 160" stroke="#0066cc" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>

  <!-- Body/Coat -->
  <rect x="150" y="170" width="100" height="120" fill="#0284c7" opacity="0.1" rx="10"/>

  <!-- Bottom text -->
  <text class="doctor-text" x="200" y="420">Dr. Upload Image</text>
  <text class="doctor-subtext" x="200" y="445">Click to add doctor profile image</text>
  <text class="doctor-subtext" x="200" y="465">via WordPress Customizer</text>
</svg>