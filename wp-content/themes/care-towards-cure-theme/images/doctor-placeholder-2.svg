<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <style>
      .background { fill: #e6f0ff; }
      .head { fill: #c9a88a; }
      .body { fill: #0066cc; }
      .collar { fill: #ffffff; }
      .button { fill: #004a99; }
      .hair { fill: #2d1b0a; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="400" height="500"/>

  <!-- Head -->
  <circle class="head" cx="200" cy="120" r="60"/>

  <!-- Hair -->
  <path class="hair" d="M 140 110 Q 140 60, 200 50 Q 260 60, 260 110 Q 260 140, 245 145 Q 155 145, 140 110" stroke="none"/>

  <!-- Hair Left Side -->
  <path class="hair" d="M 140 95 Q 130 100, 130 120 Q 130 140, 145 145"/>

  <!-- Hair Right Side -->
  <path class="hair" d="M 260 95 Q 270 100, 270 120 Q 270 140, 255 145"/>

  <!-- Body/Coat -->
  <rect class="body" x="130" y="180" width="140" height="200" rx="10"/>

  <!-- Coat Collar Left -->
  <polygon class="collar" points="200,180 170,200 170,240 200,220"/>

  <!-- Coat Collar Right -->
  <polygon class="collar" points="200,180 230,200 230,240 200,220"/>

  <!-- Coat Buttons -->
  <circle class="button" cx="200" cy="220" r="5"/>
  <circle class="button" cx="200" cy="260" r="5"/>
  <circle class="button" cx="200" cy="300" r="5"/>

  <!-- Shirt -->
  <rect class="collar" x="140" y="180" width="120" height="40"/>

  <!-- Stethoscope visualization -->
  <circle cx="200" cy="260" r="3" fill="#999"/>
  <path stroke="#999" stroke-width="2" fill="none" d="M 195 265 Q 190 270, 185 265"/>
  <path stroke="#999" stroke-width="2" fill="none" d="M 205 265 Q 210 270, 215 265"/>

  <!-- Eyes -->
  <circle cx="185" cy="110" r="4" fill="#333"/>
  <circle cx="215" cy="110" r="4" fill="#333"/>

  <!-- Mouth -->
  <path stroke="#333" stroke-width="1.5" fill="none" d="M 190 130 Q 200 135, 210 130"/>

  <!-- Bindi/Tilak (Optional cultural element) -->
  <circle cx="200" cy="95" r="2" fill="#d4006e"/>
</svg>